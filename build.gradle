plugins {
	id 'fabric-loom' version '1.0-SNAPSHOT'
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven { url = "https://maven.terraformersmc.com/releases" }
	maven { url = "https://jitpack.io" }
}

configurations {
	lodestoneQuilt
}

/**
 * LodestoneLib for 1.19.2 is only published as a Quilt mod, and this version of Loom only remaps jars that carry
 * a fabric.mod.json. Copy it with a stub one added so it can be compiled against. It is never shipped.
 */
def fabricatedLodestoneJar() {
	def source = configurations.lodestoneQuilt.singleFile
	def target = file("${buildDir}/lodestone/${source.name.replace('.jar', '-fabricated.jar')}")
	if (!target.exists()) {
		target.parentFile.mkdirs()
		new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { out ->
			new java.util.zip.ZipFile(source).withCloseable { zip ->
				zip.entries().each { entry ->
					if (entry.name != 'fabric.mod.json') {
						out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
						if (!entry.directory) {
							out << zip.getInputStream(entry)
						}
						out.closeEntry()
					}
				}
			}
			out.putNextEntry(new java.util.zip.ZipEntry('fabric.mod.json'))
			out << '{"schemaVersion": 1, "id": "lodestone", "version": "' + project.lodestone_version + '"}'
			out.closeEntry()
		}
	}
	return target
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	//modImplementation "net.fabricmc.fabric-api:fabric-api:0.37.1+1.16"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: config screen in Mod Menu, and LodestoneLib for the enhanced particles. Neither is bundled.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	lodestoneQuilt("com.github.Arathain:LodestoneLib-Quilt:${project.lodestone_version}") { transitive = false }
	modCompileOnly files(fabricatedLodestoneJar())
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
